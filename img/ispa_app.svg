<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#terminalBg)" stroke="#38bdf8" stroke-width="2" />

  <!-- Terminal Header Bar -->
  <path d="M 20 36 C 20 27 27 20 36 20 L 764 20 C 773 20 780 27 780 36 L 780 60 L 20 60 Z" fill="#091224" />
  
  <!-- Window Controls Buttons -->
  <circle cx="50" cy="40" r="6" fill="#ef4444"/>
  <circle cx="70" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="40" r="6" fill="#10b981"/>

  <!-- Title in Header -->
  <text x="400" y="44" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">screening_ispa.py — Python CLI Application</text>

  <!-- Terminal Content Lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">
    <text x="50" y="95" fill="#38bdf8">==========================================</text>
    <text x="50" y="120" fill="#38bdf8">       DETEKSI RISIKO ISPA SEDERHANA</text>
    <text x="50" y="145" fill="#38bdf8">==========================================</text>

    <text x="50" y="180" fill="#94a3b8">Nama pasien              : <tspan fill="#f8fafc">Budi Santoso</tspan></text>
    <text x="50" y="205" fill="#94a3b8">Umur pasien              : <tspan fill="#f8fafc">65 tahun</tspan></text>
    <text x="50" y="230" fill="#94a3b8">Suhu tubuh (°C)         : <tspan fill="#ef4444">38.5 °C</tspan></text>
    <text x="50" y="255" fill="#94a3b8">Frekuensi batuk per hari : <tspan fill="#f59e0b">6 kali</tspan></text>
    <text x="50" y="280" fill="#94a3b8">Mengalami sesak napas?   : <tspan fill="#ef4444">ya</tspan></text>

    <text x="50" y="320" fill="#38bdf8">==========================================</text>
    <text x="50" y="345" fill="#e0f2fe">              HASIL PEMERIKSAAN</text>
    <text x="50" y="370" fill="#38bdf8">==========================================</text>

    <text x="50" y="400" fill="#94a3b8">Skor risiko       : <tspan fill="#f8fafc">8</tspan></text>
    <text x="50" y="425" fill="#94a3b8">Tingkat risiko    : <tspan fill="#ef4444" font-weight="900">TINGGI (Perlu Penanganan Medis)</tspan></text>
  </g>

  <!-- Python Badge -->
  <g transform="translate(640, 390)">
    <rect x="0" y="0" width="110" height="40" rx="10" fill="url(#headerGrad)" />
    <text x="55" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">PYTHON 3</text>
  </g>
</svg>
