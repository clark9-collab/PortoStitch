<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark IDE / Emulator Background -->
  <rect width="900" height="600" fill="url(#bgShadow)"/>

  <!-- Phone Mockup Container (Centered Pixel 9) -->
  <g transform="translate(290, 25)" filter="url(#phoneShadow)">
    
    <!-- Outer Bezel -->
    <rect x="0" y="0" width="320" height="550" rx="36" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <rect x="8" y="8" width="304" height="534" rx="28" fill="#ffffff"/>

    <!-- Holepunch Camera -->
    <circle cx="160" cy="24" r="7" fill="#11111b"/>

    <!-- Status Bar Icons -->
    <text x="30" y="27" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#181825">9:41</text>
    <path d="M 280 20 L 292 20 L 292 28 L 280 28 Z M 292 23 L 294 23 L 294 25 L 292 25 Z" fill="#181825"/>

    <!-- Android App Bar (#6A1B9A Purple) -->
    <rect x="8" y="38" width="304" height="46" fill="#6A1B9A"/>
    <text x="160" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">Sistem Pembayaran Parkir</text>

    <!-- Main Card Body inside App -->
    <g transform="translate(20, 96)" font-family="'Plus Jakarta Sans', sans-serif">
      <rect x="0" y="0" width="280" height="420" rx="14" fill="#F3E5F5" stroke="#E1BEE7" stroke-width="1"/>

      <!-- Input 1: Nama -->
      <text x="16" y="28" font-size="11" font-weight="700" fill="#4A148C">Masukan Nama:</text>
      <text x="16" y="52" font-size="13" fill="#212121">nick</text>
      <line x1="16" y1="58" x2="264" y2="58" stroke="#7B1FA2" stroke-width="1.5"/>

      <!-- Input 2: Plat Nomor -->
      <text x="16" y="88" font-size="11" font-weight="700" fill="#4A148C">Masukan Plat Nomor:</text>
      <text x="16" y="112" font-size="13" fill="#212121">AB 1234 CD</text>
      <line x1="16" y1="118" x2="264" y2="118" stroke="#7B1FA2" stroke-width="1.5"/>

      <!-- Input 3: Merek -->
      <text x="16" y="148" font-size="11" font-weight="700" fill="#4A148C">Masukan Merek:</text>
      <text x="16" y="172" font-size="13" fill="#212121">honda</text>
      <line x1="16" y1="178" x2="264" y2="178" stroke="#7B1FA2" stroke-width="1.5"/>

      <!-- Radio Buttons: Jenis Kendaraan -->
      <text x="16" y="208" font-size="11" font-weight="700" fill="#4A148C">Pilih Jenis Kendaraan:</text>
      
      <!-- Radio 1: Sepeda Motor Selected -->
      <circle cx="24" cy="228" r="7" fill="none" stroke="#6A1B9A" stroke-width="2"/>
      <circle cx="24" cy="228" r="4" fill="#6A1B9A"/>
      <text x="36" y="232" font-size="11" font-weight="600" fill="#212121">Sepeda Motor</text>

      <!-- Radio 2: Mobil Unselected -->
      <circle cx="140" cy="228" r="7" fill="none" stroke="#757575" stroke-width="2"/>
      <text x="152" y="232" font-size="11" font-weight="600" fill="#212121">Mobil</text>

      <!-- Counter Control (- 4 +) -->
      <g transform="translate(16, 260)">
        <circle cx="20" cy="20" r="18" fill="#5E35B1"/>
        <text x="20" y="26" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">-</text>

        <text x="120" y="25" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">4</text>
        <line x1="60" y1="32" x2="180" y2="32" stroke="#9E9E9E" stroke-width="1.5"/>

        <circle cx="220" cy="20" r="18" fill="#5E35B1"/>
        <text x="220" y="26" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
      </g>

      <!-- Floating Drawer Icon -->
      <circle cx="16" cy="335" r="16" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>
      <path d="M 8 331 L 24 331 M 8 335 L 24 335 M 8 339 L 24 339" stroke="#424242" stroke-width="2"/>

      <!-- Button Proses Pembayaran -->
      <rect x="30" y="320" width="220" height="38" rx="19" fill="#6A1B9A"/>
      <text x="140" y="344" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">PROSES PEMBAYARAN</text>

    </g>

    <!-- Navigation Bar at Bottom of Screen -->
    <rect x="120" y="530" width="80" height="4" rx="2" fill="#9e9e9e"/>

  </g>
</svg>
